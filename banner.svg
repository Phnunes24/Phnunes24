<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Pedro Nunes, QA e automação de testes. Matterhorn, criação e reformulação de sites.">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150A2B"/>
      <stop offset="48%" stop-color="#22104A"/>
      <stop offset="100%" stop-color="#3A1155"/>
    </linearGradient>

    <radialGradient id="brilhoRosa" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF5FA2" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FF5FA2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoAmbar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFB25C" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FFB25C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="acento" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC46B"/>
      <stop offset="45%" stop-color="#FF6FA5"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC46B"/>
      <stop offset="34%" stop-color="#FF6FA5"/>
      <stop offset="68%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3A1155"/>
    </linearGradient>
    <linearGradient id="nome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0D9FF"/>
    </linearGradient>

    <pattern id="grade" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>

    <clipPath id="quadro">
      <rect width="1280" height="340" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#quadro)">
    <rect width="1280" height="340" fill="url(#fundo)"/>
    <rect width="1280" height="340" fill="url(#grade)"/>

    <ellipse cx="1140" cy="10" rx="440" ry="320" fill="url(#brilhoRosa)"/>
    <ellipse cx="1250" cy="330" rx="360" ry="260" fill="url(#brilhoAmbar)"/>
    <ellipse cx="90" cy="300" rx="380" ry="260" fill="url(#brilhoViolet)"/>

    <g stroke="#FFFFFF" stroke-opacity="0.05" fill="none">
      <path d="M-40 250 C 240 150, 520 330, 900 190 S 1240 60, 1340 110"/>
      <path d="M-40 300 C 260 210, 540 380, 920 240 S 1260 120, 1340 170"/>
    </g>

    <rect x="64" y="96" width="6" height="156" rx="3" fill="url(#acento)"/>

    <text x="102" y="156" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#nome)" letter-spacing="-1.6">Pedro Nunes</text>
    <text x="105" y="200" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#E9C9FF">QA e automação de testes</text>
    <text x="105" y="238" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#A98CC9">Matterhorn, criação e reformulação de sites</text>

    <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <g>
        <rect x="104" y="264" width="112" height="30" rx="15" fill="#FF6FA5" fill-opacity="0.14" stroke="#FF6FA5" stroke-opacity="0.38"/>
        <text x="160" y="284" fill="#FFC2DA" text-anchor="middle">Python</text>
      </g>
      <g>
        <rect x="226" y="264" width="152" height="30" rx="15" fill="#A855F7" fill-opacity="0.14" stroke="#A855F7" stroke-opacity="0.38"/>
        <text x="302" y="284" fill="#DEC6FF" text-anchor="middle">Acessibilidade</text>
      </g>
      <g>
        <rect x="388" y="264" width="150" height="30" rx="15" fill="#FFC46B" fill-opacity="0.13" stroke="#FFC46B" stroke-opacity="0.34"/>
        <text x="463" y="284" fill="#FFE0B2" text-anchor="middle">Front-end</text>
      </g>
    </g>

    <g>
      <rect x="812" y="74" width="392" height="192" rx="16" fill="#0F0725" fill-opacity="0.58" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <path d="M812 90 a16 16 0 0 1 16 -16 h360 a16 16 0 0 1 16 16 v22 h-392 z" fill="#FFFFFF" fill-opacity="0.05"/>
      <circle cx="840" cy="93" r="5" fill="#FF6FA5"/>
      <circle cx="858" cy="93" r="5" fill="#FFC46B"/>
      <circle cx="876" cy="93" r="5" fill="#A855F7"/>
      <text x="1184" y="98" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B79FD6" text-anchor="end">casos_de_teste</text>

      <g>
        <circle cx="844" cy="140" r="11" fill="#FF6FA5" fill-opacity="0.18"/>
        <path d="M839 140 l4 4 l8 -9" fill="none" stroke="#FF8FBB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="868" y="130" width="196" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.22"/>
        <rect x="868" y="144" width="118" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.10"/>
      </g>
      <g>
        <circle cx="844" cy="182" r="11" fill="#A855F7" fill-opacity="0.20"/>
        <path d="M839 182 l4 4 l8 -9" fill="none" stroke="#C9A2FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="868" y="172" width="150" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.22"/>
        <rect x="868" y="186" width="218" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.10"/>
      </g>
      <g>
        <circle cx="844" cy="224" r="11" fill="#FFC46B" fill-opacity="0.18"/>
        <path d="M839 224 l4 4 l8 -9" fill="none" stroke="#FFD394" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="868" y="214" width="224" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.22"/>
        <rect x="868" y="228" width="94" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.10"/>
      </g>
    </g>

    <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
      <rect x="812" y="280" width="392" height="1" fill="#FFFFFF" fill-opacity="0.10"/>
      <circle cx="822" cy="302" r="4" fill="#FFC46B"/>
      <text x="836" y="307" font-size="14" font-weight="500" fill="#C7AEE6">3 testes, 3 passaram, 0 falharam</text>
    </g>

    <rect x="0" y="334" width="1280" height="6" fill="url(#base)"/>
  </g>
</svg>
